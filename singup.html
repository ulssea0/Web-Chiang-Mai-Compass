<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link rel="stylesheet" href="singup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo">LOGO</span>
            </div>
            <div class="header-center">
                <select class="dropdown">
                    <option>Title</option>
                </select>
                <input type="text" class="search-input" placeholder="Value">
                <button class="close-btn">×</button>
            </div>
            <div class="header-right">
                <button class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="profile-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    สมัคร
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="login-box">
                <h1 class="title">สมัครสมาชิก</h1>
                
                <input type="email" class="input-field" placeholder="อีเมล์หรือเบอร์โทร">
                <input type="email" class="input-field" placeholder="ชื่อผู้ใช้">
                
                <button class="login-btn">ถัดไป</button>
                
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <button class="footer-btn">ภาษาไทย</button>
        </footer>
    </div>
</body>
</html>
